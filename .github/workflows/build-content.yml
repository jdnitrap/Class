name: Build content bundle

# Runs whenever Tier 2/Tier 3 content or the build/validation scripts change.
# Validates the content, compiles it into dist/content-bundle.json (versioned
# by git short-sha so cache-busting only happens when content actually
# changes), and commits the rebuilt bundle back to main so GitHub Pages
# (which serves straight from the main branch) picks it up automatically.
on:
  push:
    branches: [main]
    paths:
      - 'Tier 2: Nervous System/**'
      - 'Tier 3: Pathways/**'
      - 'scripts/build-content.js'
      - 'tests/validate_content.py'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Avoid infinite loop: don't re-trigger on the bot's own bundle commit.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm install js-yaml --no-save

      - name: Install Python dependencies
        run: pip install -r tests/requirements.txt

      - name: Validate content (fast pre-check)
        run: python3 tests/validate_content.py

      - name: Build content bundle
        run: node scripts/build-content.js

      - name: Commit rebuilt bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/content-bundle.json "Tier 1: Brain/Brainstem/version.js"
          if git diff --cached --quiet; then
            echo "No bundle changes to commit."
          else
            git commit -m "Rebuild content bundle [skip ci]"
            git push
          fi
