<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Loading Test</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .log {
            border: 1px solid #444;
            padding: 10px;
            margin: 10px 0;
            background: #2d2d2d;
            border-radius: 4px;
            max-height: 500px;
            overflow-y: auto;
        }
        .success { color: #4ec9b0; }
        .error { color: #f48771; }
        .warning { color: #dcdcaa; }
        .info { color: #9cdcfe; }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
        }
        button:hover {
            background: #005a9e;
        }
    </style>
</head>
<body>
    <h1>🔧 App Loading Diagnostic</h1>

    <div>
        <h3>Test Steps:</h3>
        <button onclick="testDataLoading()">Test 1: Load JSON Files</button>
        <button onclick="testInitialization()">Test 2: Initialize App</button>
        <button onclick="testNoteRendering()">Test 3: Render Notes Screen</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>

    <div class="log" id="log"></div>

    <script>
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = type;
            entry.textContent = message;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }

        async function testDataLoading() {
            clearLog();
            log('📥 Testing JSON file loading...', 'info');

            try {
                log('Fetching Tier 2/questions.json...', 'info');
                const qResponse = await fetch('Tier 2/questions.json?v=' + Date.now());
                if (!qResponse.ok) {
                    log(`❌ HTTP ${qResponse.status} when fetching questions.json`, 'error');
                    return;
                }
                const qData = await qResponse.json();
                log(`✅ Loaded questions.json: ${qData.questions.length} entries`, 'success');

                log('Fetching Tier 2/notes.json...', 'info');
                const nResponse = await fetch('Tier 2/notes.json?v=' + Date.now());
                if (!nResponse.ok) {
                    log(`❌ HTTP ${nResponse.status} when fetching notes.json`, 'error');
                    return;
                }
                const nData = await nResponse.json();
                log(`✅ Loaded notes.json: ${nData.notes.length} entries`, 'success');

                const subjects = [...new Set(nData.notes.map(n => n.subject))].sort();
                log(`✅ Unique subjects: ${subjects.join(', ')}`, 'success');

                if (subjects.includes('Pumps')) {
                    const pumpNotes = nData.notes.filter(n => n.subject === 'Pumps');
                    log(`✅ Pumps found: ${pumpNotes.length} notes`, 'success');
                } else {
                    log(`❌ Pumps NOT found in subjects!`, 'error');
                }
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        async function testInitialization() {
            clearLog();
            log('🚀 Testing app initialization...', 'info');

            try {
                // Create a test app object
                const testApp = {
                    allQuestions: [],
                    allNotes: []
                };

                // Simulate loading
                log('Simulating app.init()...', 'info');

                // Load questions
                log('Loading questions...', 'info');
                const qResponse = await fetch('Tier 2/questions.json?v=' + Date.now());
                const qData = await qResponse.json();
                testApp.allQuestions = [];
                for (const qRef of qData.questions) {
                    log(`  → Fetching ${qRef.contentFile}...`, 'info');
                }
                log(`✅ Questions loaded: ${testApp.allQuestions.length || qData.questions.length} entries`, 'success');

                // Load notes
                log('Loading notes...', 'info');
                const nResponse = await fetch('Tier 2/notes.json?v=' + Date.now());
                const nData = await nResponse.json();
                testApp.allNotes = nData.notes || [];
                log(`✅ Notes loaded: ${testApp.allNotes.length} entries`, 'success');

                // Extract subjects
                const noteSubjects = [...new Set(testApp.allNotes.map(n => n.subject))].sort();
                log(`✅ Note subjects (${noteSubjects.length}): ${noteSubjects.join(', ')}`, 'success');

                log('', 'info');
                log('Summary:', 'warning');
                log(`  Questions: ${testApp.allQuestions.length || qData.questions.length}`, 'info');
                log(`  Notes: ${testApp.allNotes.length}`, 'info');
                log(`  Note subjects: ${noteSubjects.length}`, 'info');
                log(`  Pumps in subjects: ${noteSubjects.includes('Pumps') ? '✅ YES' : '❌ NO'}`, noteSubjects.includes('Pumps') ? 'success' : 'error');

            } catch (error) {
                log(`❌ Error during initialization: ${error.message}`, 'error');
                log(`Stack: ${error.stack}`, 'error');
            }
        }

        async function testNoteRendering() {
            clearLog();
            log('🎨 Testing note rendering...', 'info');

            try {
                // Load notes
                log('Loading notes.json...', 'info');
                const response = await fetch('Tier 2/notes.json?v=' + Date.now());
                const data = await response.json();
                const notes = data.notes || [];
                log(`✅ Loaded ${notes.length} notes`, 'success');

                // Filter for Pumps
                log('Filtering for Pumps subject...', 'info');
                const pumpNotes = notes.filter(n => n.subject === 'Pumps');
                log(`✅ Found ${pumpNotes.length} Pumps notes`, 'success');

                if (pumpNotes.length === 0) {
                    log('❌ ERROR: No Pumps notes found!', 'error');
                    log('All subjects in data:', 'info');
                    const allSubjects = [...new Set(notes.map(n => n.subject))].sort();
                    allSubjects.forEach(s => {
                        const count = notes.filter(n => n.subject === s).length;
                        log(`  - ${s}: ${count} notes`, 'info');
                    });
                    return;
                }

                // Show first few Pumps notes
                log('First 5 Pumps notes:', 'info');
                pumpNotes.slice(0, 5).forEach((note, i) => {
                    log(`  ${i+1}. ID ${note.id}: "${note.title}" (${note.contentFile})`, 'info');
                });

                // Try to load content for first note
                if (pumpNotes.length > 0) {
                    log('', 'info');
                    log(`Attempting to load content for note ID ${pumpNotes[0].id}...`, 'info');
                    const contentResponse = await fetch(pumpNotes[0].contentFile);
                    if (!contentResponse.ok) {
                        log(`❌ HTTP ${contentResponse.status} when fetching ${pumpNotes[0].contentFile}`, 'error');
                        return;
                    }
                    const contentText = await contentResponse.text();
                    log(`✅ Loaded content file: ${contentText.length} characters`, 'success');

                    // Extract note content
                    const pattern = new RegExp(`\\[Note ID: ${pumpNotes[0].id}\\][\\s\\S]*?(?=\\[Note ID:|$)`);
                    const match = contentText.match(pattern);
                    if (match) {
                        const noteContent = match[0].replace(`[Note ID: ${pumpNotes[0].id}]`, '').trim();
                        log(`✅ Found note content: ${noteContent.substring(0, 100)}...`, 'success');
                    } else {
                        log(`❌ Could not find [Note ID: ${pumpNotes[0].id}] in content file`, 'error');
                    }
                }

            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        // Run all tests on load
        window.addEventListener('load', () => {
            log('Page loaded. Click buttons above to test app loading.', 'info');
        });
    </script>
</body>
</html>
